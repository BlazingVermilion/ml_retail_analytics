[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-multicurrency-analytics-ml"
version = "1.0.0"
description = "End-to-end retail analytics pipeline with PostgreSQL, Power BI, sales forecasting, and customer segmentation."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "joblib>=1.3.0",
]

[project.scripts]
retail-analytics-ml = "retail_analytics_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
